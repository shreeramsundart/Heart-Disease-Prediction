<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat min-h-screen flex flex-col" style="background-image: url('{{ url_for('static', filename='Images/heart.svg') }}');">
    <div class="flex-grow flex items-center justify-center">
        <div class="bg-black bg-opacity-70 p-8 rounded-2xl shadow-xl w-11/12 md:w-2/3 lg:w-1/2">
            <h1 class="text-3xl font-bold text-center text-white mb-6">❤️ Heart Disease Prediction</h1>
            
            <form action="/" method="post" class="space-y-4">
                <label class="block text-white">Age:</label>
                <input type="number" name="age" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                
                <label class="block text-white">Sex:</label>
                <select name="sex" class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label class="block text-white">Chest Pain Type (cp):</label>
                <input type="number" name="cp" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">

                <label class="block text-white">Resting Blood Pressure (trestbps):</label>
                <input type="number" name="trestbps" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">

                <label class="block text-white">Cholesterol (chol):</label>
                <input type="number" name="chol" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">

                <label class="block text-white">Fasting Blood Sugar > 120 mg/dl (fbs):</label>
                <select name="fbs" class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>

                <label class="block text-white">Resting ECG (restecg):</label>
                <input type="number" name="restecg" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">

                <label class="block text-white">Max Heart Rate Achieved (thalach):</label>
                <input type="number" name="thalach" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">

                <label class="block text-white">Exercise Induced Angina (exang):</label>
                <select name="exang" class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>

                <label class="block text-white">ST Depression Induced by Exercise (oldpeak):</label>
                <input type="number" step="0.1" name="oldpeak" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">

                <label class="block text-white">Slope of the Peak Exercise ST Segment (slope):</label>
                <input type="number" name="slope" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">

                <label class="block text-white">Number of Major Vessels Colored by Fluoroscopy (ca):</label>
                <input type="number" name="ca" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">

                <label class="block text-white">Thalassemia (thal):</label>
                <input type="number" name="thal" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                
                <button type="submit" class="w-full bg-red-400 hover:bg-red-500 text-white font-semibold py-3 rounded-lg transition">Predict Risk</button>
            </form>

            {% if risk %}
            <div class="mt-6 text-center bg-white bg-opacity-20 p-4 rounded-lg">
                <h2 class="text-xl font-bold text-white">Prediction Result</h2>
                <p class="text-white">The heart disease risk is: <strong>{{ risk }}</strong></p>
                <p class="text-white">Predicted Value: <strong>{{ prediction }}</strong></p>
            </div>
            {% endif %}

            {% if error %}
            <p class="text-center text-red-400 mt-4"><strong>{{ error }}</strong></p>
            {% endif %}
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full bg-black bg-opacity-50 text-white text-center py-4 mt-8">
        <p>© 2025 Shree Ram Sundar. All rights reserved.</p>
    </footer>
</body>
</html>
